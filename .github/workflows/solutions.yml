name: Solutions

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v22
        with:
          files: projects
      - name: Copy solution files into index files
        run: ./scripts/copy-solutions.sh
        shell: bash
      - name: Run changed solutions in project directories
        if: ${{ steps.changed-files.outputs.all_modified_files != '' }}
        run: bunx zx ./scripts/changed-solutions.mjs "test:solutions" ${{ steps.changed-files.outputs.all_modified_files }}
        shell: bash
      - name: Run all solutions tests
        if: ${{ steps.changed-files.outputs.all_modified_files == '' }}
        run: ./scripts/check-solutions.sh "test:solutions"
        shell: bash
